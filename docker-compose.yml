version: '3.9'

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_vol:/app/staticfiles
      - media_vol:/app/media
      - ./data:/app/data          # SQLite bazasi shu yerda saqlanadi
    expose:
      - "8000"
    depends_on: []

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "60:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_vol:/static:ro
      - media_vol:/media:ro
    depends_on:
      - web

volumes:
  static_vol:
  media_vol:
